name: Build SD.cpp Prebuilt

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target Platform / 编译目标平台'
        required: true
        default: 'linux'
        type: choice
        options:
          - 'linux'
          - 'windows'
          - 'macos'
          - 'all'
      release_tag:
        description: 'Release Tag (可选：填入主程序基准版本如 v0.1.0，主程序 v0.1.x 系列将通用此包；留空则仅临时测试)'
        required: false
        default: ''
      commit_id:
        description: 'Git Commit ID 或分支/Tag (默认锁定本地稳定 Commit)'
        required: false
        default: 'db99efdd6d2a43c7937fd55b3359206c680a75b0'
  push:
    tags:
      - 'v*'

jobs:
  # ══════════════════════════════════════════════════════════
  #  0. 版本号有效性与重复 Release 熔断预检 (耗时 ~5 秒)
  # ══════════════════════════════════════════════════════════
  precheck:
    name: "Pre-check & Version Conflict Check"
    runs-on: ubuntu-latest
    steps:
      - name: Check Version & Detect Duplicate Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "================================================================================"
          echo "🔍 [前置预检] Release Tag 重复冲突检查"
          echo "--------------------------------------------------------------------------------"
          
          TAG="${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}"
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          
          if [ -n "$TAG" ]; then
            echo "📌 目标检查 Release Tag: $TAG"
            echo "🎯 目标构建平台: $PLATFORM"
            echo "🔍 正在检查仓库中是否已有同名 Release: $TAG ..."
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "ℹ️  仓库中已存在 Release: $TAG，正在校验已发布的平台资产..."
              EXISTING_ASSETS=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null || true)
              echo "📦 当前已存在的资产列表:"
              if [ -n "$EXISTING_ASSETS" ]; then
                echo "$EXISTING_ASSETS" | sed 's/^/   - /'
              else
                echo "   (暂无文件资产)"
              fi

              WIN_MATCHES=$(echo "$EXISTING_ASSETS" | grep -iE "windows|win-x86|win64" || true)
              LINUX_MATCHES=$(echo "$EXISTING_ASSETS" | grep -iE "linux" || true)
              MAC_MATCHES=$(echo "$EXISTING_ASSETS" | grep -iE "macos|darwin|apple|arm64" || true)

              CONFLICT_FOUND=0
              CONFLICT_MSG=""

              if [ "$PLATFORM" = "windows" ]; then
                if [ -n "$WIN_MATCHES" ]; then
                  CONFLICT_FOUND=1
                  CONFLICT_MSG="Windows 平台资产已存在 ($(echo $WIN_MATCHES | tr '\n' ' '))"
                fi
              elif [ "$PLATFORM" = "linux" ]; then
                if [ -n "$LINUX_MATCHES" ]; then
                  CONFLICT_FOUND=1
                  CONFLICT_MSG="Linux 平台资产已存在 ($(echo $LINUX_MATCHES | tr '\n' ' '))"
                fi
              elif [ "$PLATFORM" = "macos" ]; then
                if [ -n "$MAC_MATCHES" ]; then
                  CONFLICT_FOUND=1
                  CONFLICT_MSG="macOS 平台资产已存在 ($(echo $MAC_MATCHES | tr '\n' ' '))"
                fi
              elif [ "$PLATFORM" = "all" ]; then
                CONFLICT_LIST=""
                [ -n "$WIN_MATCHES" ] && CONFLICT_LIST="${CONFLICT_LIST}Windows ($(echo $WIN_MATCHES | tr '\n' ' ')) "
                [ -n "$LINUX_MATCHES" ] && CONFLICT_LIST="${CONFLICT_LIST}Linux ($(echo $LINUX_MATCHES | tr '\n' ' ')) "
                [ -n "$MAC_MATCHES" ] && CONFLICT_LIST="${CONFLICT_LIST}macOS ($(echo $MAC_MATCHES | tr '\n' ' ')) "
                if [ -n "$CONFLICT_LIST" ]; then
                  CONFLICT_FOUND=1
                  CONFLICT_MSG="全平台构建 (all) 模式下检测到已有平台资产: ${CONFLICT_LIST}"
                fi
              fi

              if [ "$CONFLICT_FOUND" -eq 1 ]; then
                echo "================================================================================"
                echo "❌ ❌ ❌ [构建熔断拦截: 该平台产物已存在] ❌ ❌ ❌"
                echo "--------------------------------------------------------------------------------"
                echo "⚠️  仓库 ${{ github.repository }} 的 Release $TAG 中已存在当前平台的构建产物！"
                echo "📌 冲突详情: $CONFLICT_MSG"
                echo "💡 规则: 同一个平台不允许重复覆盖已有版本的构建产物。"
                echo "👉 解决方法:"
                echo "   1. 如需发布新版本，请指定一个新的 Release Tag 重新触发构建；"
                echo "   2. 若为多平台分批构建，请在触发弹窗的 platform 选项中选择尚未构建的具体平台 (如 windows / linux / macos)。"
                echo "================================================================================"
                exit 1
              fi
              echo "✅ 平台资产校验通过: Release $TAG 虽已存在，但目标平台 ($PLATFORM) 尚无重复产物，允许增量构建并发布！"
            else
              echo "✅ Release $TAG 尚不存在，无重复历史 Release，允许开始编译！"
            fi
          else
            echo "ℹ️ 未指定 Release Tag，本次将作为临时测试构建运行。"
          fi
          echo "================================================================================"

  # ══════════════════════════════════════════════════════════
  #  1. Linux (x86_64, Ubuntu 20.04 Container) — Vulkan + CUDA 12.8
  # ══════════════════════════════════════════════════════════
  build-linux:
    name: Linux x86_64 (Ubuntu 20.04, Vulkan + CUDA 12.8)
    needs: [precheck]
    if: github.event_name == 'push' || github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all'
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Print Linux Hardware & System Diagnostic Info
        run: |
          echo "================================================================================"
          echo "🖥️  [Linux 构建机系统与硬件环境诊断]"
          echo "--------------------------------------------------------------------------------"
          echo "📌 操作系统: $(uname -s -r -m)"
          [ -f /etc/os-release ] && grep -E '^(PRETTY_NAME|NAME|VERSION)=' /etc/os-release || true
          echo "🧠 CPU 处理器: $(grep -m1 'model name' /proc/cpuinfo 2>/dev/null | cut -d: -f2 | xargs || echo 'N/A') [逻辑核心数: $(nproc 2>/dev/null || echo 1)]"
          echo "💾 物理内存: $(free -h 2>/dev/null | awk '/^Mem:/{print "总计: "$2", 已用: "$3", 可用: "$7}' || echo 'N/A')"
          echo "💽 磁盘空间列表:"
          df -h -x tmpfs -x devtmpfs -x overlay 2>/dev/null || df -h
          echo "================================================================================"

      - name: Install System Base Tools & Modern GCC 11
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            software-properties-common curl wget git pkg-config ccache \
            libasound2-dev tar gzip xz-utils ca-certificates gnupg build-essential ninja-build
          echo "deb [trusted=yes] http://ppa.launchpad.net/ubuntu-toolchain-r/test/ubuntu focal main" | tee /etc/apt/sources.list.d/ubuntu-toolchain-r-test.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc-11 g++-11

      - name: Setup Portable CMake (3.28.6)
        run: |
          mkdir -p /tmp/cmake
          curl -sSL "https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-linux-x86_64.tar.gz" \
            | tar -xz -C /tmp/cmake --strip-components=1
          echo "/tmp/cmake/bin" >> $GITHUB_PATH

      - name: Setup Vulkan SDK (1.3.290.0)
        run: |
          mkdir -p /tmp/vulkansdk
          curl -sSL "https://sdk.lunarg.com/sdk/download/1.3.290.0/linux/vulkansdk-linux-x86_64-1.3.290.0.tar.xz" \
            | tar -xJ -C /tmp/vulkansdk --strip-components=1
          echo "VULKAN_SDK=/tmp/vulkansdk/x86_64" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=/tmp/vulkansdk/x86_64" >> $GITHUB_ENV
          echo "/tmp/vulkansdk/x86_64/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/tmp/vulkansdk/x86_64/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

      - name: Setup NVIDIA CUDA Toolkit (12.8.x)
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2004/x86_64/cuda-keyring_1.1-1_all.deb -O /tmp/cuda-keyring.deb
          dpkg -i /tmp/cuda-keyring.deb && rm -f /tmp/cuda-keyring.deb
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cuda-nvcc-12-8 cuda-cudart-dev-12-8 libcublas-dev-12-8 libcurand-dev-12-8 cuda-cccl-12-8
          echo "CUDA_PATH=/usr/local/cuda-12.8" >> $GITHUB_ENV
          echo "/usr/local/cuda-12.8/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/usr/local/cuda-12.8/lib64:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_id || 'db99efdd6d2a43c7937fd55b3359206c680a75b0' }}
          submodules: recursive
          fetch-depth: 0

      - name: Build Vulkan & CPU Binaries
        run: |
          export CC=gcc-11
          export CXX=g++-11
          cmake -B build-vulkan -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DSD_BUILD_SHARED_LIBS=ON \
            -DSD_BUILD_SHARED_GGML_LIB=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DSD_BUILD_EXAMPLES=OFF \
            -DSD_SERVER_BUILD_FRONTEND=OFF \
            -DSD_WEBP=OFF \
            -DSD_WEBM=OFF \
            -DSD_VULKAN=ON \
            -DVULKAN_SDK=$VULKAN_SDK \
            -DCMAKE_PREFIX_PATH="$VULKAN_SDK;$VULKAN_SDK/share/cmake"
          cmake --build build-vulkan --config Release -j $(nproc)

      - name: Build CUDA Binaries
        run: |
          export CC=gcc-11
          export CXX=g++-11
          export CUDAHOSTCXX=g++-11
          cmake -B build-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_CUDA_HOST_COMPILER=g++-11 \
            -DSD_BUILD_SHARED_LIBS=ON \
            -DSD_BUILD_SHARED_GGML_LIB=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DSD_BUILD_EXAMPLES=OFF \
            -DSD_SERVER_BUILD_FRONTEND=OFF \
            -DSD_WEBP=OFF \
            -DSD_WEBM=OFF \
            -DSD_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89;100;120;120-virtual"
          cmake --build build-cuda --config Release -j $(nproc)

      - name: Organize Output Artifacts (Linux)
        run: |
          mkdir -p dist/sdcpp/engines dist/sdcpp/ggml

          # 收集 Vulkan/CPU 主引擎与 ggml
          find build-vulkan/ -type f \( -name "*.so*" \) | while read file; do
            filename=$(basename "$file")
            if [[ "$filename" == *"ggml"* ]]; then
              cp -fP "$file" dist/sdcpp/ggml/
            elif [[ "$filename" == *"stable-diffusion"* || "$filename" == *"sd."* ]]; then
              cp -fP "$file" dist/sdcpp/engines/
            fi
          done

          # 收集 CUDA 插件 (ggml-cuda)
          find build-cuda/ -type f \( -name "*cuda*.so*" \) | while read file; do
            cp -fP "$file" dist/sdcpp/ggml/
          done

          # 打包
          cd dist
          tar -czf ../sdcpp-linux-x86_64.tar.gz sdcpp
          cd ..

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdcpp-linux-x86_64
          path: sdcpp-linux-x86_64.tar.gz

  # ══════════════════════════════════════════════════════════
  #  2. Windows (x86_64-pc-windows-msvc) — Vulkan + CUDA 12.8
  # ══════════════════════════════════════════════════════════
  build-windows:
    name: Windows x86_64 (Vulkan + CUDA)
    needs: [precheck]
    if: github.event_name == 'push' || github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all'
    runs-on: windows-2022
    env:
      CUDAFLAGS: "--allow-unsupported-compiler"
      NVCC_APPEND_FLAGS: "--allow-unsupported-compiler"
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_id || 'db99efdd6d2a43c7937fd55b3359206c680a75b0' }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup Ninja
        shell: powershell
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }
          ninja --version

      - name: Setup Vulkan SDK
        shell: powershell
        run: |
          $ver = "1.4.350.0"
          $installer = "$env:TEMP\vulkansdk.exe"
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
          Write-Host "Downloading Vulkan SDK $ver via curl.exe (High Speed)..."
          curl.exe -sSL -f -o $installer $url
          
          Write-Host "Installing Vulkan SDK quietly via official installer..."
          Start-Process -FilePath $installer -ArgumentList "--root C:\VulkanSDK --accept-licenses --default-answer --confirm-command install" -Wait
          if (Test-Path $installer) { Remove-Item -Force $installer }
          
          Write-Host "================ [ VULKAN SDK READY ] ================"
          Get-ChildItem "C:\VulkanSDK" | Format-Table
          
          echo "VULKAN_SDK=C:\VulkanSDK" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=C:\VulkanSDK;C:\VulkanSDK\share\cmake" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\Bin" >> $env:GITHUB_PATH

      - name: Setup CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.8.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev"]'

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Print System & Hardware Specs
        shell: powershell
        run: |
          Write-Host "================ [ OS & SYSTEM INFO ] ================"
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture, BuildNumber | Format-List
          
          Write-Host "================ [ CPU INFO ] ================"
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed | Format-List
          
          Write-Host "================ [ MEMORY & DISK INFO ] ================"
          $totalRam = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB
          $freeRam = (Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB
          Write-Host ("Total RAM: {0:N2} GB, Free RAM: {1:N2} GB" -f $totalRam, $freeRam)
          Get-PSDrive C -ErrorAction SilentlyContinue | Select-Object Name, @{Name="Used(GB)";Expression={[math]::Round($_.Used/1GB,2)}}, @{Name="Free(GB)";Expression={[math]::Round($_.Free/1GB,2)}} | Format-Table
          
          Write-Host "================ [ TOOLCHAIN INFO ] ================"
          cmake --version | Select-Object -First 1
          ninja --version
          if (Get-Command nvcc -ErrorAction SilentlyContinue) { nvcc --version | Select-Object -Last 2 }
          Write-Host "======================================================"

      - name: Build Vulkan & CPU Binaries
        shell: cmd
        run: |
          cmake -B build-vulkan -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_CXX_FLAGS="/bigobj /EHsc" ^
            -DCMAKE_C_FLAGS="/bigobj /EHsc" ^
            -DSD_BUILD_SHARED_LIBS=ON ^
            -DSD_BUILD_SHARED_GGML_LIB=ON ^
            -DBUILD_SHARED_LIBS=ON ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CPU_ALL_VARIANTS=OFF ^
            -DSD_BUILD_EXAMPLES=OFF ^
            -DSD_SERVER_BUILD_FRONTEND=OFF ^
            -DSD_WEBP=OFF ^
            -DSD_WEBM=OFF ^
            -DSD_VULKAN=ON ^
            -DVULKAN_SDK=C:\VulkanSDK ^
            -DCMAKE_PREFIX_PATH="C:\VulkanSDK;C:\VulkanSDK\share\cmake"
          cmake --build build-vulkan --config Release -j 4

      - name: Build CUDA Binaries
        shell: cmd
        run: |
          cmake -B build-cuda -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_CXX_FLAGS="/bigobj /EHsc" ^
            -DCMAKE_C_FLAGS="/bigobj /EHsc" ^
            -DSD_BUILD_SHARED_LIBS=ON ^
            -DSD_BUILD_SHARED_GGML_LIB=ON ^
            -DBUILD_SHARED_LIBS=ON ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CPU_ALL_VARIANTS=OFF ^
            -DSD_BUILD_EXAMPLES=OFF ^
            -DSD_SERVER_BUILD_FRONTEND=OFF ^
            -DSD_WEBP=OFF ^
            -DSD_WEBM=OFF ^
            -DSD_CUDA=ON ^
            -DCMAKE_CUDA_FLAGS="--allow-unsupported-compiler" ^
            -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89;100;120;120-virtual"
          cmake --build build-cuda --config Release -j 4

      - name: Organize Output Artifacts (Windows)
        shell: bash
        run: |
          mkdir -p dist/sdcpp/engines dist/sdcpp/ggml

          # 收集 Vulkan/CPU 主引擎与 ggml
          find build-vulkan/ -type f \( -name "*.dll" -o -name "*.lib" \) | while read file; do
            filename=$(basename "$file")
            if [[ "$filename" == *"ggml"* ]]; then
              cp -f "$file" dist/sdcpp/ggml/
            elif [[ "$filename" == *"stable-diffusion"* || "$filename" == *"sd."* ]]; then
              cp -f "$file" dist/sdcpp/engines/
            fi
          done

          # 收集 CUDA 插件 (ggml-cuda)
          find build-cuda/ -type f \( -name "*cuda*.dll" -o -name "*cuda*.lib" \) | while read file; do
            cp -f "$file" dist/sdcpp/ggml/
          done

          # 打包
          cd dist
          tar -czf ../sdcpp-windows-x86_64.tar.gz sdcpp
          cd ..

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdcpp-windows-x86_64
          path: sdcpp-windows-x86_64.tar.gz

  # ══════════════════════════════════════════════════════════
  #  3. Apple macOS (ARM64 / Apple Silicon) — Metal 加速
  # ══════════════════════════════════════════════════════════
  build-macos:
    name: macOS ARM64 (Apple Silicon Metal)
    needs: [precheck]
    if: github.event_name == 'push' || github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'all'
    runs-on: macos-14
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_id || 'db99efdd6d2a43c7937fd55b3359206c680a75b0' }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup Ninja
        run: |
          brew install ninja
          ninja --version

      - name: Print System & Hardware Specs
        run: |
          echo "================ [ OS & SYSTEM INFO ] ================"
          sw_vers
          uname -a
          echo "================ [ CPU INFO ] ================"
          sysctl -n machdep.cpu.brand_string || true
          sysctl hw.ncpu hw.physicalcpu
          echo "================ [ MEMORY & DISK INFO ] ================"
          sysctl hw.memsize
          df -h
          echo "================ [ TOOLCHAIN INFO ] ================"
          cmake --version | head -n1
          ninja --version
          clang --version | head -n1
          echo "======================================================"

      - name: Build Metal Binaries
        run: |
          cmake -B build-metal -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSD_BUILD_SHARED_LIBS=ON \
            -DSD_BUILD_SHARED_GGML_LIB=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DSD_BUILD_EXAMPLES=OFF \
            -DSD_SERVER_BUILD_FRONTEND=OFF \
            -DSD_WEBP=OFF \
            -DSD_WEBM=OFF \
            -DSD_METAL=ON \
            -DCMAKE_OSX_ARCHITECTURES="arm64"
          cmake --build build-metal --config Release -j $(sysctl -n hw.ncpu)

      - name: Organize Output Artifacts (macOS ARM64 Metal)
        run: |
          mkdir -p dist/sdcpp/engines dist/sdcpp/ggml

          # 收集 dylib 和 metal 资源
          find build-metal/ -type f \( -name "*.dylib*" -o -name "*.metal" -o -name "*.metallib" \) | while read file; do
            filename=$(basename "$file")
            if [[ "$filename" == *"ggml"* || "$filename" == *"metal"* ]]; then
              cp -fP "$file" dist/sdcpp/ggml/
            elif [[ "$filename" == *"stable-diffusion"* || "$filename" == *"sd."* ]]; then
              cp -fP "$file" dist/sdcpp/engines/
            fi
          done

          # 打包
          cd dist
          tar -czf ../sdcpp-macos-arm64.tar.gz sdcpp
          cd ..

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdcpp-macos-arm64
          path: sdcpp-macos-arm64.tar.gz

  # ══════════════════════════════════════════════════════════
  #  4. GitHub Release 自动发布 (打 Tag 时自动合并发布全平台产物)
  # ══════════════════════════════════════════════════════════
  release:
    name: Create or Update GitHub Release
    needs: [precheck, build-linux, build-windows, build-macos]
    if: (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')) && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "SD.cpp Prebuilt ${{ github.event.inputs.release_tag || github.ref_name }}"
          body: |
            ## 📦 Stable Diffusion C++ Prebuilt Binaries (${{ github.event.inputs.release_tag || github.ref_name }})

            ### 📌 Commit & Version Info
