name: Build SD.cpp Prebuilt

on:
  workflow_dispatch:
    inputs:
      commit_id:
        description: 'Git Commit ID 或分支/Tag (默认锁定本地稳定 Commit)'
        required: false
        default: 'db99efdd6d2a43c7937fd55b3359206c680a75b0'
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Windows x86_64 (Vulkan + CUDA)
    runs-on: windows-latest
    env:
      CUDAFLAGS: "--allow-unsupported-compiler"
      NVCC_APPEND_FLAGS: "--allow-unsupported-compiler"
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_id || 'db99efdd6d2a43c7937fd55b3359206c680a75b0' }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup Ninja
        shell: powershell
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }
          ninja --version

      - name: Setup Vulkan SDK (7z Fast Extract)
        shell: powershell
        run: |
          $ver = "1.4.350.0"
          $installer = "$env:TEMP\vulkansdk.exe"
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
          Write-Host "Downloading Vulkan SDK $ver via curl.exe (High Speed)..."
          curl.exe -sSL -f -o $installer $url
          
          Write-Host "Extracting Vulkan SDK and nested packages via 7z..."
          New-Item -ItemType Directory -Force -Path "C:\VulkanSDK_raw", "C:\VulkanSDK" | Out-Null
          7z x $installer -oC:\VulkanSDK_raw -y -bso0 -bsp0
          if (Test-Path $installer) { Remove-Item -Force $installer }
          
          # 解压所有嵌套的 .7z / .zip 归档 (LunarG 核心与组件包)
          Get-ChildItem -Path "C:\VulkanSDK_raw" -Recurse -Include *.7z, *.zip | ForEach-Object {
            7z x $_.FullName -o"$($_.Directory.FullName)" -y -bso0 -bsp0
          }
          
          # 组装完整 Vulkan SDK 结构 (Include, Lib, Bin, share/cmake 等)
          $vulkanHeader = Get-ChildItem -Path "C:\VulkanSDK_raw" -Recurse -Filter "vulkan.h" -ErrorAction SilentlyContinue | Select-Object -First 1
          $vulkanLib = Get-ChildItem -Path "C:\VulkanSDK_raw" -Recurse -Filter "vulkan-1.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          $glslcBin = Get-ChildItem -Path "C:\VulkanSDK_raw" -Recurse -Filter "glslc.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $spirvHeaderCmake = Get-ChildItem -Path "C:\VulkanSDK_raw" -Recurse -Filter "*SPIRV-Headers*Config.cmake" -ErrorAction SilentlyContinue | Select-Object -First 1
          
          if ($vulkanHeader) {
            New-Item -ItemType Directory -Force -Path "C:\VulkanSDK\Include" | Out-Null
            Copy-Item -Recurse -Force "$($vulkanHeader.Directory.Parent.FullName)\*" "C:\VulkanSDK\Include\" -ErrorAction SilentlyContinue
          }
          if ($vulkanLib) {
            New-Item -ItemType Directory -Force -Path "C:\VulkanSDK\Lib" | Out-Null
            Copy-Item -Recurse -Force "$($vulkanLib.Directory.FullName)\*" "C:\VulkanSDK\Lib\" -ErrorAction SilentlyContinue
          }
          if ($glslcBin) {
            New-Item -ItemType Directory -Force -Path "C:\VulkanSDK\Bin" | Out-Null
            Copy-Item -Recurse -Force "$($glslcBin.Directory.FullName)\*" "C:\VulkanSDK\Bin\" -ErrorAction SilentlyContinue
          }
          
          $spirvDir = "C:\VulkanSDK"
          if ($spirvHeaderCmake) {
            $spirvDir = $spirvHeaderCmake.Directory.FullName
            New-Item -ItemType Directory -Force -Path "C:\VulkanSDK\share\cmake\SPIRV-Headers" | Out-Null
            Copy-Item -Recurse -Force "$spirvDir\*" "C:\VulkanSDK\share\cmake\SPIRV-Headers\" -ErrorAction SilentlyContinue
            Write-Host "Found SPIRV-Headers at: $spirvDir"
          }
          
          Remove-Item -Recurse -Force "C:\VulkanSDK_raw" -ErrorAction SilentlyContinue
          
          Write-Host "================ [ VULKAN SDK READY ] ================"
          Get-ChildItem "C:\VulkanSDK" | Format-Table
          
          echo "VULKAN_SDK=C:\VulkanSDK" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=C:\VulkanSDK;$spirvDir" >> $env:GITHUB_ENV
          echo "Vulkan_INCLUDE_DIR=C:\VulkanSDK\Include" >> $env:GITHUB_ENV
          echo "Vulkan_LIBRARY=C:\VulkanSDK\Lib\vulkan-1.lib" >> $env:GITHUB_ENV
          echo "Vulkan_GLSLC_EXECUTABLE=C:\VulkanSDK\Bin\glslc.exe" >> $env:GITHUB_ENV
          echo "SPIRV-Headers_DIR=$spirvDir" >> $env:GITHUB_ENV
          echo "SPIRV_HEADERS_DIR=$spirvDir" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\Bin" >> $env:GITHUB_PATH

      - name: Setup CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.8.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev"]'

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Print System & Hardware Specs
        shell: powershell
        run: |
          Write-Host "================ [ OS & SYSTEM INFO ] ================"
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture, BuildNumber | Format-List
          
          Write-Host "================ [ CPU INFO ] ================"
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed | Format-List
          
          Write-Host "================ [ MEMORY & DISK INFO ] ================"
          $totalRam = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB
          $freeRam = (Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB
          Write-Host ("Total RAM: {0:N2} GB, Free RAM: {1:N2} GB" -f $totalRam, $freeRam)
          Get-PSDrive C -ErrorAction SilentlyContinue | Select-Object Name, @{Name="Used(GB)";Expression={[math]::Round($_.Used/1GB,2)}}, @{Name="Free(GB)";Expression={[math]::Round($_.Free/1GB,2)}} | Format-Table
          
          Write-Host "================ [ TOOLCHAIN INFO ] ================"
          cmake --version | Select-Object -First 1
          ninja --version
          if (Get-Command nvcc -ErrorAction SilentlyContinue) { nvcc --version | Select-Object -Last 2 }
          Write-Host "======================================================"

      - name: Build Vulkan & CPU Binaries
        shell: cmd
        run: |
          cmake -B build-vulkan -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DSD_BUILD_SHARED_LIBS=ON ^
            -DSD_BUILD_SHARED_GGML_LIB=ON ^
            -DBUILD_SHARED_LIBS=ON ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CPU_ALL_VARIANTS=OFF ^
            -DSD_BUILD_EXAMPLES=OFF ^
            -DSD_SERVER_BUILD_FRONTEND=OFF ^
            -DSD_WEBP=OFF ^
            -DSD_WEBM=OFF ^
            -DSD_VULKAN=ON ^
            -DVULKAN_SDK="%VULKAN_SDK%" ^
            -DCMAKE_PREFIX_PATH="%CMAKE_PREFIX_PATH%" ^
            -DVulkan_INCLUDE_DIR="%Vulkan_INCLUDE_DIR%" ^
            -DVulkan_LIBRARY="%Vulkan_LIBRARY%" ^
            -DVulkan_GLSLC_EXECUTABLE="%Vulkan_GLSLC_EXECUTABLE%" ^
            -DSPIRV-Headers_DIR="%SPIRV-Headers_DIR%" ^
            -DSPIRV_HEADERS_DIR="%SPIRV_HEADERS_DIR%"
          cmake --build build-vulkan --config Release -j 4

      - name: Build CUDA Binaries
        shell: cmd
        run: |
          cmake -B build-cuda -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DSD_BUILD_SHARED_LIBS=ON ^
            -DSD_BUILD_SHARED_GGML_LIB=ON ^
            -DBUILD_SHARED_LIBS=ON ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CPU_ALL_VARIANTS=OFF ^
            -DSD_BUILD_EXAMPLES=OFF ^
            -DSD_SERVER_BUILD_FRONTEND=OFF ^
            -DSD_WEBP=OFF ^
            -DSD_WEBM=OFF ^
            -DSD_CUDA=ON ^
            -DCMAKE_CUDA_FLAGS="--allow-unsupported-compiler" ^
            -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89;100;120;120-virtual"
          cmake --build build-cuda --config Release -j 4

      - name: Organize Output Artifacts (Windows)
        shell: bash
        run: |
          mkdir -p dist/sdcpp/engines dist/sdcpp/ggml

          # 收集 Vulkan/CPU 主引擎与 ggml
          find build-vulkan/ -type f \( -name "*.dll" -o -name "*.lib" \) | while read file; do
            filename=$(basename "$file")
            if [[ "$filename" == *"ggml"* ]]; then
              cp -f "$file" dist/sdcpp/ggml/
            elif [[ "$filename" == *"stable-diffusion"* || "$filename" == *"sd."* ]]; then
              cp -f "$file" dist/sdcpp/engines/
            fi
          done

          # 收集 CUDA 插件 (ggml-cuda)
          find build-cuda/ -type f \( -name "*cuda*.dll" -o -name "*cuda*.lib" \) | while read file; do
            cp -f "$file" dist/sdcpp/ggml/
          done

          # 打包
          cd dist
          tar -czf ../sdcpp-windows-x86_64.tar.gz sdcpp
          cd ..

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdcpp-windows-x86_64
          path: sdcpp-windows-x86_64.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
